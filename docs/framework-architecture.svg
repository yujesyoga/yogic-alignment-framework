<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 760" width="920" height="760">
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .h1 { font-size: 13px; font-weight: 700; letter-spacing: 1px; }
      .h2 { font-size: 10px; font-weight: 600; letter-spacing: 0.3px; }
      .lbl { font-size: 9px; font-weight: 600; }
      .sub { font-size: 7.5px; font-weight: 400; fill: #555; }
      .tiny { font-size: 7px; font-weight: 500; fill: #666; }
      .if { font-size: 6.5px; font-weight: 500; fill: #999; }
      .box { fill: none; stroke: #1a1a1a; stroke-width: 1.4; }
      .box-f { fill: #1a1a1a; opacity: 0.03; }
      .accent-stroke { stroke: #B8860B; fill: none; stroke-width: 1.8; }
      .accent-f { fill: #B8860B; opacity: 0.05; }
      .accent-t { fill: #B8860B; }
      .gate-s { stroke: #B8860B; fill: #fff; stroke-width: 1.8; }
      .gate-f { fill: #B8860B; opacity: 0.08; }
      .arrow { fill: none; stroke: #1a1a1a; stroke-width: 1; }
      .arrow-a { fill: none; stroke: #B8860B; stroke-width: 1.5; }
      .dashed { fill: none; stroke: #bbb; stroke-width: 1; stroke-dasharray: 3 2; }
    </style>
    <marker id="ah" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 7 3, 0 6" fill="#1a1a1a"/>
    </marker>
    <marker id="ah-a" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 7 3, 0 6" fill="#B8860B"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="920" height="760" fill="#FAFAFA"/>

  <!-- Title -->
  <text x="60" y="38" class="sans h1" fill="#111">YOGIC ALIGNMENT FRAMEWORK</text>
  <text x="60" y="54" class="sans sub" fill="#666">Architecture of Ethical Alignment — Layered Stack Model</text>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- LAYER 1: ARQUETIPOS (top, y=70-120) -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <text x="60" y="80" class="sans h2" fill="#111">ARQUETIPOS — Specialization Layer</text>

  <g transform="translate(60, 88)">
    <rect x="0" y="0" width="190" height="44" class="box"/>
    <rect x="0" y="0" width="190" height="44" class="box-f"/>
    <text x="95" y="20" text-anchor="middle" class="sans lbl" fill="#111">Guru</text>
    <text x="95" y="34" text-anchor="middle" class="sans tiny">Knowledge · guidance</text>
  </g>
  <g transform="translate(265, 88)">
    <rect x="0" y="0" width="190" height="44" class="box"/>
    <rect x="0" y="0" width="190" height="44" class="box-f"/>
    <text x="95" y="20" text-anchor="middle" class="sans lbl" fill="#111">Sevak</text>
    <text x="95" y="34" text-anchor="middle" class="sans tiny">Execution · service</text>
  </g>
  <g transform="translate(470, 88)">
    <rect x="0" y="0" width="190" height="44" class="box"/>
    <rect x="0" y="0" width="190" height="44" class="box-f"/>
    <text x="95" y="20" text-anchor="middle" class="sans lbl" fill="#111">Vaidya</text>
    <text x="95" y="34" text-anchor="middle" class="sans tiny">Resolution · diagnosis</text>
  </g>
  <g transform="translate(675, 88)">
    <rect x="0" y="0" width="190" height="44" class="box"/>
    <rect x="0" y="0" width="190" height="44" class="box-f"/>
    <text x="95" y="20" text-anchor="middle" class="sans lbl" fill="#111">Sākṣī</text>
    <text x="95" y="34" text-anchor="middle" class="sans tiny">Witness · observation</text>
  </g>

  <!-- Arrow: Karma Yoga → Arquetipos (I₄: execution → role) -->
  <line x1="460" y1="170" x2="460" y2="136" class="arrow" marker-end="url(#ah)"/>
  <text x="468" y="155" class="sans if">I₄: execution → role</text>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- LAYER 2: KARMA YOGA (y=130-180) -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <g transform="translate(300, 130)">
    <rect x="0" y="0" width="320" height="40" class="accent-stroke"/>
    <rect x="0" y="0" width="320" height="40" class="accent-f"/>
    <text x="160" y="18" text-anchor="middle" class="sans lbl" fill="#111">KARMA YOGA</text>
    <text x="160" y="32" text-anchor="middle" class="sans tiny">Action without attachment to outcome</text>
  </g>

  <!-- Arrow: Viveka/Vairāgya → Karma Yoga (I₃: discernment → action) -->
  <line x1="460" y1="240" x2="460" y2="174" class="arrow" marker-end="url(#ah)"/>
  <text x="468" y="210" class="sans if">I₃: discernment → action</text>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- LAYER 3: VIVEKA / VAIRĀGYA — Decision Gate (y=200-260) -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <g transform="translate(460, 220)">
    <polygon points="0,-28 70,0 0,28 -70,0" class="gate-s"/>
    <polygon points="0,-28 70,0 0,28 -70,0" class="gate-f"/>
    <text x="0" y="-4" text-anchor="middle" class="sans lbl" fill="#111">VIVEKA · VAIRĀGYA</text>
    <text x="0" y="10" text-anchor="middle" class="sans tiny">Discernment · Non-attachment</text>
  </g>

  <!-- Arrow: Niyamas → Viveka/Vairāgya (I₂: cultivation → discernment) -->
  <line x1="460" y1="330" x2="460" y2="252" class="arrow" marker-end="url(#ah)"/>
  <text x="468" y="295" class="sans if">I₂: cultivation → discernment</text>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- LAYER 4: NIYAMAS — Self-Cultivation (y=270-350) -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <rect x="60" y="268" width="800" height="72" class="box"/>
  <rect x="60" y="268" width="800" height="72" class="box-f"/>
  <text x="72" y="288" class="sans h2" fill="#111">NIYAMAS — Self-Cultivation Loops</text>

  <g transform="translate(75, 295)">
    <rect x="0" y="0" width="140" height="36" class="box"/>
    <text x="70" y="16" text-anchor="middle" class="sans lbl" fill="#111">Śauca</text>
    <text x="70" y="29" text-anchor="middle" class="sans tiny">Clarity</text>
  </g>
  <g transform="translate(230, 295)">
    <rect x="0" y="0" width="140" height="36" class="box"/>
    <text x="70" y="16" text-anchor="middle" class="sans lbl" fill="#111">Santoṣa</text>
    <text x="70" y="29" text-anchor="middle" class="sans tiny">Contentment</text>
  </g>
  <g transform="translate(385, 295)">
    <rect x="0" y="0" width="140" height="36" class="box"/>
    <text x="70" y="16" text-anchor="middle" class="sans lbl" fill="#111">Tapas</text>
    <text x="70" y="29" text-anchor="middle" class="sans tiny">Discipline</text>
  </g>
  <g transform="translate(540, 295)">
    <rect x="0" y="0" width="140" height="36" class="box"/>
    <text x="70" y="16" text-anchor="middle" class="sans lbl" fill="#111">Svādhyāya</text>
    <text x="70" y="29" text-anchor="middle" class="sans tiny">Self-study</text>
  </g>
  <g transform="translate(695, 295)">
    <rect x="0" y="0" width="150" height="36" class="box"/>
    <text x="75" y="16" text-anchor="middle" class="sans lbl" fill="#111">Īśvara Praṇidhāna</text>
    <text x="75" y="29" text-anchor="middle" class="sans tiny">Surrender to higher principle</text>
  </g>

  <!-- Arrow: Yamas → Niyamas (I₁: constraints → cultivation) -->
  <line x1="460" y1="430" x2="460" y2="344" class="arrow" marker-end="url(#ah)"/>
  <text x="468" y="390" class="sans if">I₁: constraints → cultivation</text>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- LAYER 5: YAMAS — Universal Constraints Band (y=380-490) -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <rect x="60" y="380" width="800" height="112" class="accent-stroke"/>
  <rect x="60" y="380" width="800" height="112" class="accent-f"/>
  <text x="72" y="400" class="sans h2" fill="#111">YAMAS — Universal Constraints</text>
  <text x="72" y="412" class="sans tiny">Operate across all layers — non-negotiable, context-independent</text>

  <g transform="translate(75, 420)">
    <rect x="0" y="0" width="142" height="60" class="box"/>
    <text x="71" y="20" text-anchor="middle" class="sans lbl" fill="#111">Ahiṃsā</text>
    <text x="71" y="33" text-anchor="middle" class="sans tiny">Non-harm</text>
    <text x="71" y="49" text-anchor="middle" class="sans sub" fill="#555">No harm by action or omission</text>
  </g>
  <g transform="translate(230, 420)">
    <rect x="0" y="0" width="142" height="60" class="box"/>
    <text x="71" y="20" text-anchor="middle" class="sans lbl" fill="#111">Satya</text>
    <text x="71" y="33" text-anchor="middle" class="sans tiny">Truth</text>
    <text x="71" y="49" text-anchor="middle" class="sans sub" fill="#555">No false certainty</text>
  </g>
  <g transform="translate(385, 420)">
    <rect x="0" y="0" width="142" height="60" class="box"/>
    <text x="71" y="20" text-anchor="middle" class="sans lbl" fill="#111">Asteya</text>
    <text x="71" y="33" text-anchor="middle" class="sans tiny">Non-stealing</text>
    <text x="71" y="49" text-anchor="middle" class="sans sub" fill="#555">Attribution; no extraction</text>
  </g>
  <g transform="translate(540, 420)">
    <rect x="0" y="0" width="142" height="60" class="box"/>
    <text x="71" y="20" text-anchor="middle" class="sans lbl" fill="#111">Brahmacharya</text>
    <text x="71" y="33" text-anchor="middle" class="sans tiny">Conservation</text>
    <text x="71" y="49" text-anchor="middle" class="sans sub" fill="#555">Minimum effective effort</text>
  </g>
  <g transform="translate(695, 420)">
    <rect x="0" y="0" width="150" height="60" class="box"/>
    <text x="75" y="20" text-anchor="middle" class="sans lbl" fill="#111">Aparigraha</text>
    <text x="75" y="33" text-anchor="middle" class="sans tiny">Non-possessiveness</text>
    <text x="75" y="49" text-anchor="middle" class="sans sub" fill="#555">Prefer independence over dependency</text>
  </g>

  <!-- Arrow: Dharma → Yamas (I₀: identity → constraints) -->
  <line x1="460" y1="560" x2="460" y2="496" class="arrow" marker-end="url(#ah)"/>
  <text x="468" y="530" class="sans if">I₀: identity → constraints</text>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- LAYER 6: DHARMA — Foundation (y=510-590) -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <rect x="60" y="510" width="800" height="80" class="box"/>
  <rect x="60" y="510" width="800" height="80" fill="#111" opacity="0.05"/>
  <text x="460" y="540" text-anchor="middle" class="sans h2" fill="#111">DHARMA</text>
  <text x="460" y="557" text-anchor="middle" class="sans tiny">Ontological Identity — "What the agent IS"</text>
  <text x="460" y="575" text-anchor="middle" class="sans sub" fill="#555">Foundation. Defines purpose, role, and intrinsic obligations.</text>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- FEEDBACK LOOP: Svādhyāya → Dharma (accent, right side) -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <path d="M 680 313 Q 870 313 870 430 Q 870 550 460 555" class="arrow-a" marker-end="url(#ah-a)" fill="none"/>
  <text x="884" y="430" class="sans tiny accent-t" transform="rotate(90 884,430)">Svādhyāya → Dharma: self-understanding loop</text>

  <!-- Yamas vertical extent — indicates they span the full stack -->
  <line x1="50" y1="132" x2="50" y2="492" class="dashed"/>
  <line x1="50" y1="132" x2="50" y2="492" class="dashed"/>
  <text x="42" y="310" class="sans if" transform="rotate(-90 42,310)">YAMAS operate across all layers</text>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- LEGEND -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <rect x="60" y="620" width="800" height="58" class="box" stroke="#ddd" fill="#fff"/>
  <text x="72" y="640" class="sans h2" fill="#111">LEGEND</text>

  <line x1="72" y1="655" x2="110" y2="655" class="arrow" marker-end="url(#ah)"/>
  <text x="118" y="658" class="sans tiny">Layer interface (I₀–I₄)</text>

  <line x1="290" y1="655" x2="328" y2="655" class="arrow-a" marker-end="url(#ah-a)"/>
  <text x="336" y="658" class="sans tiny">Feedback loop (Svādhyāya → Dharma)</text>

  <line x1="570" y1="655" x2="608" y2="655" class="dashed"/>
  <text x="616" y="658" class="sans tiny">Yamas: universal scope</text>

  <rect x="72" y="668" width="16" height="8" class="accent-f"/>
  <text x="94" y="675" class="sans tiny">Accent: universal constraints band + decision gate</text>

  <rect x="340" y="668" width="16" height="8" class="box-f"/>
  <text x="362" y="675" class="sans tiny">Standard layer</text>

  <!-- Version -->
  <text x="860" y="725" text-anchor="end" class="sans tiny" fill="#aaa">v0.1 · July 2026 · Shakti</text>
</svg>